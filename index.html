<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Kovárna</title>
<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kovárna">
<meta name="theme-color" content="#0a0a0a">
<link rel="apple-touch-icon" href="/icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0a;--s1:#111;--s2:#1a1a1a;--b1:#1f1f1f;--b2:#2a2a2a;
  --accent:#c8f542;--abg:#1a2200;--text:#e0e0e0;--muted:#555;--m2:#3a3a3a;
  --red:#ff4444;
}
html,body{height:100dvh;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:15px;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}

/* HEADER */
.hdr{padding:14px 16px 10px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.logo{font-family:'Bebas Neue';font-size:26px;letter-spacing:2px;color:var(--accent)}
.hdr-right{display:flex;align-items:center;gap:10px}
.hdr-date{font-size:11px;color:var(--muted)}
.icon-btn{background:none;border:1px solid var(--b2);color:var(--muted);border-radius:8px;padding:6px 12px;font-family:"Bebas Neue";font-size:13px;letter-spacing:1px;cursor:pointer;transition:all .15s}
.icon-btn:hover,.icon-btn.active{border-color:var(--accent);color:var(--accent)}

/* WEEK VIEW — MAIN */
.week-area{flex:1;display:flex;flex-direction:column;padding:0 16px;min-height:0;touch-action:pan-y}
.week-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.week-nav-btn{background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;padding:4px 8px;line-height:1}
.week-range{font-size:12px;color:var(--muted);letter-spacing:.5px}
.week-days{display:flex;flex-direction:column;gap:6px;flex:1;min-height:0}

.w-day{
  background:var(--s1);border:1px solid var(--b1);border-radius:12px;
  display:flex;align-items:center;padding:0 16px;
  cursor:pointer;transition:transform .1s,border-color .15s;
  flex:1;min-height:0;
  -webkit-tap-highlight-color:transparent;
}
.w-day:active{transform:scale(.98)}
.w-day.today{border-color:var(--accent);background:var(--abg)}
.w-day.has-train{background:var(--abg);border-color:#2d3d00}
.w-day.is-rest{background:var(--s2);border-color:var(--b2)}
.w-day-left{display:flex;align-items:center;gap:12px;min-width:80px}
.w-day-name{font-size:11px;color:var(--muted);letter-spacing:.5px;text-transform:uppercase;min-width:20px}
.w-day-num{font-family:'Bebas Neue';font-size:28px;color:var(--text);line-height:1}
.w-day.today .w-day-num{color:var(--accent)}
.w-day.has-train .w-day-num{color:var(--accent)}
.w-day-right{flex:1;display:flex;align-items:center;gap:8px;justify-content:flex-end}
.w-dots{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.w-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.w-rest{font-size:13px;color:var(--muted);font-size:12px}
.w-grp-labels{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.w-grp-label{font-size:10px;padding:2px 6px;border-radius:4px;background:var(--s2);color:var(--muted)}

/* AI STRIP */
.ai-chat{padding:8px 16px 10px;flex-shrink:0;border-top:1px solid var(--b1)}
.ai-result{background:var(--abg);border:1px solid #2d3d00;border-radius:10px;padding:12px 14px;font-size:12px;color:#cce870;line-height:1.7;display:none;margin-bottom:8px;max-height:120px;overflow-y:auto}
.ai-quick-chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:8px;padding-bottom:2px}
.ai-quick-chips::-webkit-scrollbar{display:none}
.ai-chip{background:var(--s2);border:1px solid var(--b2);color:var(--muted);border-radius:20px;padding:5px 12px;font-size:12px;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:all .15s;font-family:'DM Sans'}
.ai-chip:hover{border-color:var(--accent);color:var(--accent)}
.ai-input-row{display:flex;gap:8px;align-items:center}
.ai-input{flex:1;background:var(--s2);border:1px solid var(--b2);color:var(--text);border-radius:10px;padding:10px 14px;font-family:'DM Sans';font-size:14px;outline:none}
.ai-input:focus{border-color:var(--accent)}
.ai-send{background:var(--accent);border:none;color:#0a0a0a;border-radius:10px;width:42px;height:42px;font-size:20px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue'}
.ai-send:active{opacity:.8}
.ai-send:disabled{opacity:.4;cursor:default}

/* BOTTOM NAV */
.bnav{display:flex;border-top:1px solid var(--b1);flex-shrink:0}
.bnav-btn{flex:1;background:none;border:none;color:var(--muted);font-family:'Bebas Neue';font-size:13px;letter-spacing:1px;padding:10px 4px 12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;transition:color .15s}
.bnav-btn.active{color:var(--accent)}

/* SHEETS */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100}
.overlay.open{display:block}
.sheet{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-radius:20px 20px 0 0;z-index:101;transform:translateY(100%);transition:transform .3s ease;max-height:92dvh;overflow-y:auto;padding:16px 16px 40px}
.sheet.open{transform:translateY(0)}
.sheet-handle{width:36px;height:4px;background:var(--b2);border-radius:2px;margin:0 auto 16px}
.sheet-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.sheet-title{font-family:'Bebas Neue';font-size:20px;letter-spacing:1px}
.close-btn{background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;line-height:1}

/* DAY DETAIL SHEET */
.day-sessions{margin-bottom:16px}
.session-item{background:var(--s1);border:1px solid var(--b1);border-radius:10px;padding:12px;margin-bottom:8px;position:relative;overflow:hidden}
.session-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.session-name{font-size:14px;font-weight:500}
.session-sets{display:flex;gap:6px;flex-wrap:wrap}
.set-chip{font-size:11px;color:var(--muted);background:var(--s2);padding:3px 8px;border-radius:4px}
.session-actions{display:flex;gap:6px;margin-top:8px}
.s-btn{background:none;border:1px solid var(--b2);color:var(--muted);border-radius:6px;padding:4px 10px;font-size:11px;cursor:pointer;transition:all .15s}
.s-btn.edit:hover{border-color:var(--accent);color:var(--accent)}
.s-btn.del:hover{border-color:var(--red);color:var(--red)}

/* MONTH SHEET */
.month-grid-hdr{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:6px}
.month-grid-hdr span{text-align:center;font-size:10px;color:var(--muted)}
.month-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.m-cell{aspect-ratio:1;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;border:1px solid transparent;transition:all .15s;position:relative}
.m-cell:hover{border-color:var(--b2)}
.m-cell.today{border-color:var(--accent)}
.m-cell.has-train{background:var(--abg)}
.m-cell.is-rest{background:var(--s2)}
.m-cell.empty{cursor:default}
.m-cell-num{font-size:12px;color:var(--text)}
.m-cell.today .m-cell-num{color:var(--accent);font-weight:500}
.m-dots{display:flex;gap:2px;margin-top:2px;flex-wrap:wrap;justify-content:center}
.m-dot{width:4px;height:4px;border-radius:50%}
.month-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.month-nav-btn{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;padding:4px 8px}
.month-title{font-family:'Bebas Neue';font-size:18px;letter-spacing:1px}

/* FORM */
.form-label{font-size:11px;color:var(--muted);letter-spacing:.5px;margin-bottom:6px}
.inp{background:var(--s2);border:1px solid var(--b2);color:var(--text);border-radius:8px;padding:10px 14px;font-family:'DM Sans';font-size:15px;width:100%;outline:none;margin-bottom:12px}
.inp:focus{border-color:var(--accent)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{padding:6px 14px;border-radius:20px;background:var(--s2);border:1px solid var(--b2);color:var(--muted);font-size:13px;cursor:pointer;white-space:nowrap;transition:all .15s}
.chip.active{background:var(--abg);border-color:var(--accent);color:var(--accent)}
.set-row{display:grid;grid-template-columns:36px 1fr 1fr 28px;gap:6px;margin-bottom:6px;align-items:center}
.set-num{font-family:'Bebas Neue';font-size:20px;color:var(--m2);text-align:center}
.del-set{background:none;border:none;color:var(--m2);cursor:pointer;font-size:16px;padding:2px}
.del-set:hover{color:var(--red)}
.btn{background:var(--accent);color:#0a0a0a;border:none;border-radius:8px;font-family:'Bebas Neue';font-size:18px;letter-spacing:1px;padding:12px;cursor:pointer;width:100%;margin-top:4px}
.btn:active{opacity:.8}
.btn-g{background:none;border:1px solid var(--b2);color:var(--muted);border-radius:8px;font-size:13px;padding:8px 14px;cursor:pointer;transition:all .15s;width:100%;margin-top:8px}
.btn-g:hover{border-color:var(--accent);color:var(--accent)}
.pb-box{background:var(--abg);border:1px solid #2d3d00;border-radius:8px;padding:8px 12px;margin-bottom:12px;font-size:11px;color:#aad060}
.pb-box strong{color:var(--accent)}
.divider{display:flex;align-items:center;gap:8px;margin:10px 0}
.divider span{font-size:10px;color:var(--muted);letter-spacing:1px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--b1)}
.tag{display:inline-block;font-size:10px;padding:2px 8px;border-radius:4px;background:var(--abg);color:var(--accent)}

/* HIST/PROG */
.sub-area{flex:1;overflow-y:auto;padding:0 16px 20px;min-height:0}
.hi{padding:12px 0;border-bottom:1px solid var(--b1);cursor:pointer}
.hi:last-child{border-bottom:none}
.pb-bar{display:flex;gap:3px;align-items:flex-end;height:36px}
.pb-b{flex:1;background:var(--accent);border-radius:3px 3px 0 0;min-height:3px;opacity:.5}
.pb-b:last-child{opacity:1}

/* BODY MAP */
.body-hs{cursor:pointer;transition:opacity .15s}
.body-hs:hover{opacity:.8}
.body-hs:active{opacity:.6}

/* TOAST */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--accent);color:#0a0a0a;padding:8px 18px;border-radius:20px;font-size:13px;font-weight:500;z-index:999;pointer-events:none;opacity:0;transition:opacity .2s;white-space:nowrap}
.toast.show{opacity:1}

select.inp{appearance:none;cursor:pointer}
</style>
</head>
<body>

<!-- HEADER -->
<div class="hdr">
  <div class="logo">KOVÁRNA</div>
  <div class="hdr-right">
    <span class="hdr-date" id="hdr-date"></span>
    <button class="icon-btn" onclick="openMonth()">MĚSÍC</button>
    <button class="icon-btn active" id="btn-week" onclick="showView('week')">TÝDEN</button>
    <button class="icon-btn" id="btn-hist" onclick="showView('hist')">HISTORIE</button>
    <button class="icon-btn" id="btn-prog" onclick="showView('prog')">PROGRES</button>
  </div>
</div>

<!-- WEEK VIEW -->
<div id="view-week" style="flex:1;display:flex;flex-direction:column;min-height:0">
  <div class="week-area">
    <div class="week-nav">
      <button class="week-nav-btn" onclick="weekPrev()">←</button>
      <span class="week-range" id="week-range"></span>
      <button class="week-nav-btn" onclick="weekNext()">→</button>
    </div>
    <div class="week-days" id="week-days"></div>
  </div>
  <div class="ai-chat">
    <div id="ai-result" class="ai-result"></div>
    <div class="ai-quick-chips">
      <button class="ai-chip" onclick="sendAI('Co bych měl dnes cvičit?')">Dnes</button>
      <button class="ai-chip" onclick="sendAI('Co bych měl cvičit zítra?')">Zítra</button>
      <button class="ai-chip" onclick="sendAI('Udělej mi plán na tento týden podle mé historie.')">Plán týdne</button>
      <button class="ai-chip" onclick="sendAI('Jak si celkově vedu? Zhodnoť můj pokrok.')">Pokrok</button>
    </div>
    <div class="ai-input-row">
      <input class="ai-input" id="ai-input" placeholder="Zeptej se AI trenéra..." onkeydown="if(event.key==='Enter')sendAI()">
      <button class="ai-send" id="ai-send" onclick="sendAI()">→</button>
    </div>
  </div>
</div>

<!-- HIST VIEW -->
<div id="view-hist" style="flex:1;display:none;flex-direction:column;min-height:0">
  <div style="padding:0 16px 10px;flex-shrink:0;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none" id="hist-filter"></div>
  <div class="sub-area">
    <div id="hist-list"></div>
  </div>
</div>

<!-- PROG VIEW -->
<div id="view-prog" style="flex:1;display:none;flex-direction:column;min-height:0;overflow:hidden">
  <div style="flex:1;display:flex;flex-direction:column;min-height:0;padding:6px 10px 0">

    <div style="flex:1;display:flex;gap:10px;min-height:0;align-items:flex-start">

      <!-- PŘEDNÍ POHLED -->
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;min-height:0">
        <div style="font-size:9px;color:var(--muted);letter-spacing:1px;margin-bottom:3px;font-family:Bebas Neue">PŘEDNÍ</div>
        <svg viewBox="0 0 200 480" style="width:100%;height:auto">
          <defs><style>.base{fill:#1e1e1e;stroke:#444;stroke-width:0.6}.line{fill:none;stroke:#555;stroke-width:0.8}</style></defs>
          <defs>
  <style>
    .base{fill:#1e1e1e;stroke:#444;stroke-width:0.6}
    .line{fill:none;stroke:#555;stroke-width:0.8}
    .muscle{stroke:none}
  </style>
</defs>

const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRlaWtxaWZjaXlyd3lpeHJubGNtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkwNDkyNzUsImV4cCI6MjEwNDYyNTI3NX0.GLVzb164MexRX2QoObwFErZu8Bky-HuAWTAuw7-Cm08';
const sb=supabase.createClient(SB_URL,SB_KEY);

const GROUPS=['Záda','Hrudník','Nohy','Ramena','Biceps','Triceps','Břicho'];
const DEF={
  Záda:['Přítahy na hrazdě','Veslování s činkou','Jednorůční veslování','Lat pulldown','Seated row','Hyperextenze'],
  Hrudník:['Bench press','Šikmý bench press','Peck deck','Dips na bradlech'],
  Nohy:['Leg press','Leg curl','Leg extension','Hip thrust','Lýtka'],
  Ramena:['Vojenský tlak','Laterální zdvihy','Face pull'],

  Břicho:['Hanging knee raise','Plank','Cable crunch']

const GRP_COLORS={Záda:'#c8f542',Hrudník:'#42b8f5',Nohy:'#f5a142',Ramena:'#f542c8',Biceps:'#42f5a1',Triceps:'#f5f542',Břicho:'#f54242'};
const MONTHS=['Leden','Únor','Březen','Duben','Květen','Červen','Červenec','Srpen','Září','Říjen','Listopad','Prosinec'];

// STATE
let sessions=[],restDays=[],custom={};
let grp='Záda',sets=[{r:'',w:''}],hf='Vše',expH=null;
let editingIds=[];
let weekStart=mondayOf(new Date());
let calMonth=new Date().getMonth(),calYear=new Date().getFullYear();
let selectedDate=new Date().toLocaleDateString('cs-CZ');
let activeView='week';

// INIT
async function init(){
  document.getElementById('hdr-date').textContent=new Date().toLocaleDateString('cs-CZ');
  renderG();renderE();renderS();
  await Promise.all([loadSessions(),loadRestDays()]);
  renderWeek();renderHist();renderProg();

  // Swipe between weeks
  let tx=0;
  const wa=document.getElementById('view-week');
  wa.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;},{passive:true});
  wa.addEventListener('touchend',e=>{
    const dx=e.changedTouches[0].clientX-tx;
    if(Math.abs(dx)>60){dx<0?weekNext():weekPrev();}
  },{passive:true});

  if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
}

async function loadSessions(){
  const{data}=await sb.from('gym_sessions').select('*').order('created_at',{ascending:false}).limit(500);
  sessions=data||[];
}
async function loadRestDays(){
  const{data}=await sb.from('rest_days').select('*');
  restDays=(data||[]).map(r=>r.date);
}

// HELPERS
function mondayOf(d){
  const dt=new Date(d);
  const dow=dt.getDay()===0?6:dt.getDay()-1;
  dt.setDate(dt.getDate()-dow);dt.setHours(0,0,0,0);return dt;
}
function ds(d){return new Date(d).toLocaleDateString('cs-CZ');}
function trainDates(){return new Set(sessions.map(s=>s.date));}
function restSet(){return new Set(restDays);}
function grpsFor(date){return[...new Set(sessions.filter(s=>s.date===date).map(s=>s.grp))];}

// VIEW SWITCH
function showView(v){
  activeView=v;
  ['week','hist','prog'].forEach(n=>{
    const el=document.getElementById('view-'+n);
    el.style.display=n===v?'flex':'none';
    document.getElementById('btn-'+n)?.classList.toggle('active',n===v);
    document.getElementById('bnav-'+n)?.classList.toggle('active',n===v);
  });
  if(v==='hist')renderHist();
  if(v==='prog')renderProg();
}

// WEEK
function renderWeek(){
  const dates=trainDates(),rests=restSet();
  const todayStr=new Date().toLocaleDateString('cs-CZ');
  const end=new Date(weekStart);end.setDate(end.getDate()+6);
  document.getElementById('week-range').textContent=
    weekStart.getDate()+'.'+(weekStart.getMonth()+1)+'. – '+end.getDate()+'.'+(end.getMonth()+1)+'.';

  let html='';
  for(let i=0;i<7;i++){
    const d=new Date(weekStart);d.setDate(d.getDate()+i);
    const dstr=ds(d);
    const hasTrain=dates.has(dstr),isRest=rests.has(dstr),isToday=dstr===todayStr;
    const grps=grpsFor(dstr);
    const dots=grps.map(g=>`<div class="w-dot" style="background:${GRP_COLORS[g]}"></div>`).join('');
    const labels=grps.map(g=>`<span class="w-grp-label" style="color:${GRP_COLORS[g]};background:${GRP_COLORS[g]}22">${g}</span>`).join('');
    html+=`<div class="w-day${hasTrain?' has-train':''}${isRest?' is-rest':''}${isToday?' today':''}" onclick="openDay('${dstr}')">
      <div class="w-day-left">
        <div class="w-day-name">${DAYS[d.getDay()]}</div>
        <div class="w-day-num">${d.getDate()}</div>
      </div>
      <div class="w-day-right">
        ${hasTrain?`<div class="w-grp-labels">${labels}</div>`:''}
        ${isRest?'<span class="w-rest">Volno</span>':''}
        ${!hasTrain&&!isRest?'<span style="font-size:11px;color:var(--m2)">—</span>':''}
      </div>
    </div>`;
  }
  document.getElementById('week-days').innerHTML=html;
}

function weekPrev(){weekStart.setDate(weekStart.getDate()-7);renderWeek();}
function weekNext(){weekStart.setDate(weekStart.getDate()+7);renderWeek();}

// DAY SHEET
function openDay(date){
  selectedDate=date;
  const parts=date.split('.');
  document.getElementById('day-sheet-title').textContent=parts[0]+'. '+MONTHS[parseInt(parts[1])-1];
  renderDaySessions();
  openSheet('day-sheet');
}

function renderDaySessions(){
  const daySessions=sessions.filter(s=>s.date===selectedDate);
  const dl=document.getElementById('day-sessions');
  if(!daySessions.length){dl.innerHTML='<div style="text-align:center;padding:20px 0;color:var(--muted);font-size:13px">Žádný trénink tento den</div>';return;}

  window._sd={};
  const byEx={};
  daySessions.forEach(s=>{if(!byEx[s.ex])byEx[s.ex]={grp:s.grp,sets:[]};byEx[s.ex].sets.push(s);});

  dl.innerHTML=Object.entries(byEx).map(([ex,d],idx)=>{
    window._sd[idx]={ex,grp:d.grp,ids:d.sets.map(s=>s.id)};
    const mx=Math.max(...d.sets.map(s=>s.weight||0));
    const setsHtml=d.sets.map(s=>`<span class="set-chip">${s.serie}× ${s.reps}r @ ${s.weight}kg</span>`).join('');
    return `<div class="session-item">
      <div class="session-top">
        <div><span class="tag">${d.grp}</span><span class="session-name" style="margin-left:8px">${ex}</span></div>
        <span style="font-size:11px;color:var(--muted)">${mx}kg max</span>
      </div>
      <div class="session-sets">${setsHtml}</div>
      <div class="session-actions">
        <button class="s-btn edit" onclick="editEx(${idx})">Upravit</button>
        <button class="s-btn del" onclick="delEx(${idx})">Smazat</button>
      </div>
    </div>`;
  }).join('');
}

function editEx(idx){
  const d=window._sd[idx];
  editingIds=d.ids;
  grp=d.grp;renderG();renderE();
  document.getElementById('esel').value=d.ex;
  const editSessions=sessions.filter(s=>d.ids.includes(s.id)||d.ids.includes(String(s.id)));
  sets=editSessions.map(s=>({r:s.reps||'',w:s.weight||''}));
  if(!sets.length)sets=[{r:'',w:''}];
  renderS();updPrev();
  document.getElementById('train-title').textContent='UPRAVIT CVIK';
  openTrainSheet();
}

async function delEx(idx){
  const d=window._sd[idx];
  if(!confirm('Smazat tento cvik?'))return;
  await sb.from('gym_sessions').delete().in('id',d.ids);
  sessions=sessions.filter(s=>!d.ids.includes(s.id)&&!d.ids.includes(String(s.id)));
  renderDaySessions();renderWeek();renderHist();renderProg();
  showToast('✓ Smazáno');
}

async function saveRest(){
  if(restDays.includes(selectedDate)){showToast('Rest day již označen');return;}
  await sb.from('rest_days').insert({date:selectedDate,note:''});
  restDays.push(selectedDate);
  renderWeek();closeAll();showToast('🛌 Rest day uložen');
}

// TRAIN SHEET
function openTrainSheet(){
  closeSheet('day-sheet');
  setTimeout(()=>openSheet('train-sheet'),300);
}

function closeTrainSheet(){
  closeSheet('train-sheet');
  document.getElementById('train-title').textContent='ZAPSAT TRÉNINK';
  editingIds=[];sets=[{r:'',w:''}];renderS();
  setTimeout(()=>openSheet('day-sheet'),300);
}

// SAVE
async function saveEntry(){
  const ex=document.getElementById('esel').value;
  const vs=sets.filter(s=>s.r||s.w);
  if(!ex||!vs.length){showToast('Vyplň cvik a sérii');return;}
  const note=document.getElementById('note').value.trim();
  const isEdit=editingIds.length>0;
  try{
    if(isEdit){
      await sb.from('gym_sessions').delete().in('id',editingIds);
      sessions=sessions.filter(s=>!editingIds.includes(s.id)&&!editingIds.includes(String(s.id)));
    }
    const rows=vs.map((s,i)=>({date:selectedDate,grp,ex,serie:i+1,reps:s.r||0,weight:s.w||0,note:i===0?note:''}));
    const{data,error}=await sb.from('gym_sessions').insert(rows).select();
    if(error)throw error;
    sessions.unshift(...(data||rows.map((r,i)=>({...r,id:Date.now()+i}))));
    sets=[{r:'',w:''}];document.getElementById('note').value='';renderS();
    closeSheet('train-sheet');
    document.getElementById('train-title').textContent='ZAPSAT TRÉNINK';
    editingIds=[];
    renderDaySessions();renderWeek();renderHist();renderProg();
    setTimeout(()=>openSheet('day-sheet'),300);
    showToast(isEdit?'✓ Upraveno':'✓ Uloženo');
    updateAIMemory();
  }catch(e){showToast('Chyba: '+e.message);}
}

// MONTH
function openMonth(){
  renderMonth();openSheet('month-sheet');
}

function renderMonth(){
  document.getElementById('month-title').textContent=MONTHS[calMonth]+' '+calYear;
  const firstDay=new Date(calYear,calMonth,1);
  const total=new Date(calYear,calMonth+1,0).getDate();
  const startDow=firstDay.getDay()===0?6:firstDay.getDay()-1;
  const dates=trainDates(),rests=restSet();
  const todayStr=new Date().toLocaleDateString('cs-CZ');
  let html='';
  for(let i=0;i<startDow;i++)html+='<div class="m-cell empty"></div>';
  for(let d=1;d<=total;d++){
    const dt=new Date(calYear,calMonth,d).toLocaleDateString('cs-CZ');
    const hasTrain=dates.has(dt),isRest=rests.has(dt),isToday=dt===todayStr;
    const grps=grpsFor(dt);
    const dots=grps.slice(0,3).map(g=>`<div class="m-dot" style="background:${GRP_COLORS[g]}"></div>`).join('');
    html+=`<div class="m-cell${hasTrain?' has-train':''}${isRest?' is-rest':''}${isToday?' today':''}" onclick="monthDayClick('${dt}')">
      <div class="m-cell-num">${d}</div>
      <div class="m-dots">${hasTrain?dots:isRest?'🛌':''}</div>
    </div>`;
  }
  document.getElementById('month-grid').innerHTML=html;
}

function monthDayClick(date){
  // Nastav týden na ten den a otevři detail
  const d=new Date(date.split('.').reverse().join('-'));
  weekStart=mondayOf(d);
  renderWeek();
  closeSheet('month-sheet');
  setTimeout(()=>openDay(date),350);
}

function mPrev(){calMonth--;if(calMonth<0){calMonth=11;calYear--;}renderMonth();}
function mNext(){calMonth++;if(calMonth>11){calMonth=0;calYear++;}renderMonth();}

// FORM HELPERS
function renderG(){
  document.getElementById('gchips').innerHTML=GROUPS.map(g=>
    `<div class="chip${g===grp?' active':''}" onclick="selG('${g}',this)">${g}</div>`
  ).join('');
}
function selG(g,el){grp=g;document.querySelectorAll('#gchips .chip').forEach(c=>c.classList.remove('active'));el.classList.add('active');renderE();updPrev();}
function renderE(){
  const ex=[...(DEF[grp]||[]),...(custom[grp]||[])];
  document.getElementById('esel').innerHTML=ex.map(e=>`<option>${e}</option>`).join('');
  updPrev();
}
function addCustom(){
  const v=document.getElementById('newinp').value.trim();
  if(!v)return;
  if(!custom[grp])custom[grp]=[];
  custom[grp].push(v);renderE();
  document.getElementById('esel').value=v;
  document.getElementById('newinp').value='';updPrev();
}
function updPrev(){
  const ex=document.getElementById('esel').value;
  const box=document.getElementById('pbbox');
  const prev=sessions.filter(s=>s.ex===ex&&s.grp===grp);
  if(!prev.length){box.style.display='none';return;}
  const last=prev[0];
  const mw=Math.max(...sessions.filter(s=>s.ex===ex&&s.grp===grp&&s.date===last.date).map(s=>s.weight||0));
  const tr=sessions.filter(s=>s.ex===ex&&s.grp===grp&&s.date===last.date).reduce((a,s)=>a+(s.reps||0),0);
  box.style.display='block';
  box.innerHTML=`<strong>Minule (${last.date}):</strong> max <strong>${mw}kg</strong> · ${tr} opak.`;
}
function renderS(){
  document.getElementById('sets').innerHTML=sets.map((s,i)=>`
    <div class="set-row">
      <div class="set-num">${i+1}</div>
      <input class="inp" type="number" placeholder="12" value="${s.r}" oninput="sets[${i}].r=+this.value" inputmode="numeric" style="margin-bottom:0">
      <input class="inp" type="number" placeholder="80" value="${s.w}" oninput="sets[${i}].w=+this.value" inputmode="decimal" step="0.5" style="margin-bottom:0">
      <button class="del-set" onclick="remSet(${i})">×</button>
    </div>`).join('');
}
function addSet(){sets.push({r:'',w:''});renderS();}
function remSet(i){if(sets.length===1)return;sets.splice(i,1);renderS();}

// HISTORY
function renderHist(){
  const fc=document.getElementById('hist-filter');
  fc.innerHTML=['Vše',...GROUPS].map(g=>
    `<div class="chip${g===hf?' active':''}" onclick="fH('${g}',this)" style="flex-shrink:0">${g}</div>`
  ).join('');
  const fl=hf==='Vše'?sessions:sessions.filter(s=>s.grp===hf);
  const l=document.getElementById('hist-list');
  if(!fl.length){l.innerHTML='<div style="text-align:center;padding:40px;color:var(--muted)">Žádné záznamy</div>';return;}
  const groups={};
  fl.forEach(s=>{const k=s.date+'|'+s.grp+'|'+s.ex;if(!groups[k])groups[k]={date:s.date,grp:s.grp,ex:s.ex,sets:[]};groups[k].sets.push(s);});
  l.innerHTML=Object.entries(groups).map(([k,g])=>{
    const mx=Math.max(...g.sets.map(s=>s.weight||0));
    const tr=g.sets.reduce((a,s)=>a+(s.reps||0),0);
    const exp=expH===k;
    return `<div class="hi">
      <div style="display:flex;justify-content:space-between;margin-bottom:4px" onclick="togH('${k}')">
        <div><span class="tag">${g.grp}</span><span style="font-size:14px;font-weight:500;margin-left:8px">${g.ex}</span></div>
        <button class="s-btn del" onclick="event.stopPropagation();delGroup('${k}')">Smazat</button>
      </div>
      <div style="font-size:12px;color:var(--muted);cursor:pointer" onclick="togH('${k}')">${g.date} · ${g.sets.length} sérií · max ${mx}kg · ${tr} opak.</div>
      ${exp?`<div style="margin-top:10px;background:var(--s2);border-radius:8px;padding:10px 12px">
        ${g.sets.map(s=>`<div style="display:flex;gap:8px;font-size:12px;color:var(--muted);padding:4px 0;align-items:center;border-bottom:1px solid var(--b1)">
          <span style="min-width:50px;color:var(--m2)">Série ${s.serie}</span>
          <input type="number" value="${s.reps||0}" onchange="editSet('${s.id}','reps',this.value)" style="width:50px;background:var(--bg);border:1px solid var(--b2);color:var(--text);border-radius:4px;padding:3px 6px;font-size:12px;text-align:center">
          <span style="color:var(--m2)">opak.</span>
          <input type="number" value="${s.weight||0}" step="0.5" onchange="editSet('${s.id}','weight',this.value)" style="width:54px;background:var(--bg);border:1px solid var(--b2);color:var(--text);border-radius:4px;padding:3px 6px;font-size:12px;text-align:center">
          <span style="color:var(--m2)">kg</span>
          <button onclick="delSet('${s.id}')" style="background:none;border:none;color:var(--m2);cursor:pointer;margin-left:auto">×</button>
        </div>`).join('')}
      </div>`:''}
    </div>`;
  }).join('');
}
function togH(k){expH=expH===k?null:k;renderHist();}
function fH(g,el){hf=g;renderHist();}
async function delGroup(k){
  if(!confirm('Smazat celý cvik?'))return;
  const[date,grpN,ex]=k.split('|');
  const ids=sessions.filter(s=>s.date===date&&s.grp===grpN&&s.ex===ex).map(s=>s.id);
  await sb.from('gym_sessions').delete().in('id',ids);
  sessions=sessions.filter(s=>!ids.includes(s.id));
  renderHist();renderWeek();showToast('✓ Smazáno');
}
async function delSet(id){
  if(!confirm('Smazat sérii?'))return;
  await sb.from('gym_sessions').delete().eq('id',id);
  sessions=sessions.filter(s=>s.id!==id&&String(s.id)!==id);
  renderHist();showToast('✓ Smazáno');
}
async function editSet(id,field,val){
  const update={[field]:field==='reps'?parseInt(val):parseFloat(val)};
  await sb.from('gym_sessions').update(update).eq('id',id);
  const s=sessions.find(s=>s.id===id||String(s.id)===id);
  if(s)s[field]=update[field];
  showToast('✓ Upraveno');
}

// PROGRESS — BODY MAP
const GRP_COLORS_MAP={Záda:'#c8f542',Hrudník:'#42b8f5',Nohy:'#f5a142',Ramena:'#f542c8',Biceps:'#42f5a1',Triceps:'#f5f542',Břicho:'#f54242'};

// Přední partie
const FRONT_GROUPS=['Hrudník','Ramena','Biceps','Triceps','Břicho','Nohy','Záda'];
// Zadní partie
const BACK_GROUPS=['Záda','Ramena','Triceps','Nohy'];

function renderProg(){
  const now=Date.now();
  const month=30*24*60*60*1000;

  FRONT_GROUPS.forEach(grp=>{
    const grpS=sessions.filter(s=>s.grp===grp&&s.weight>0);
    const mx=grpS.length?Math.max(...grpS.map(s=>s.weight||0)):0;
    const recentCount=grpS.filter(s=>new Date(s.created_at||0).getTime()>now-month).length;
    const intensity=Math.min(0.3+recentCount/15*0.65,0.95);

    // Front overlay
    const fg=document.getElementById('f-'+grp);
    if(fg)fg.setAttribute('opacity',grpS.length?String(intensity):'0');

    // Front label
    const fl=document.getElementById('flb-'+grp);
    if(fl){fl.textContent=mx>0?mx+'kg':'';fl.setAttribute('opacity',grpS.length?'1':'0');}
  });

  BACK_GROUPS.forEach(grp=>{
    const grpS=sessions.filter(s=>s.grp===grp&&s.weight>0);
    const mx=grpS.length?Math.max(...grpS.map(s=>s.weight||0)):0;
    const recentCount=grpS.filter(s=>new Date(s.created_at||0).getTime()>now-month).length;
    const intensity=Math.min(0.3+recentCount/15*0.65,0.95);

    const bg=document.getElementById('b-'+grp);
    if(bg)bg.setAttribute('opacity',grpS.length?String(intensity):'0');

    const bl=document.getElementById('blb-'+grp);
    if(bl){bl.textContent=mx>0?mx+'kg':'';bl.setAttribute('opacity',grpS.length?'1':'0');}
  });
}

function showBodyPart(grp){
  const grpSessions=sessions.filter(s=>s.grp===grp&&s.weight>0);
  const detail=document.getElementById('body-detail');
  const title=document.getElementById('bd-title');
  const cont=document.getElementById('bd-content');
  const colors={Záda:'#c8f542',Hrudník:'#42b8f5',Nohy:'#f5a142',Ramena:'#f542c8',Biceps:'#42f5a1',Triceps:'#f5f542',Břicho:'#f54242'};
  title.style.color=colors[grp]||'var(--accent)';
  title.textContent=grp.toUpperCase();

  if(!grpSessions.length){
    cont.innerHTML='<div style="color:var(--muted);font-size:13px">Žádné záznamy pro tuto partii</div>';
    detail.style.display='block';return;
  }

  // Max ever
  const mx=Math.max(...grpSessions.map(s=>s.weight||0));

  // Last session
  const lastDate=grpSessions[0].date;
  const lastS=grpSessions.filter(s=>s.date===lastDate);
  const lastMx=Math.max(...lastS.map(s=>s.weight||0));
  const lastReps=lastS.find(s=>s.weight===lastMx)?.reps||0;

  // Suggested next (5% increase)
  const suggested=Math.round(lastMx*1.05*2)/2;

  // Group by exercise
  const byEx={};
  grpSessions.forEach(s=>{if(!byEx[s.ex])byEx[s.ex]={mx:0,count:0,lastW:0};if(s.weight>byEx[s.ex].mx)byEx[s.ex].mx=s.weight;byEx[s.ex].count++;byEx[s.ex].lastW=s.weight;});

  cont.innerHTML=`
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px">
      <div style="background:var(--s2);border-radius:8px;padding:10px 8px;text-align:center">
        <div style="font-family:'Bebas Neue';font-size:24px;color:${colors[grp]}">${mx}kg</div>
        <div style="font-size:10px;color:var(--muted)">MAXIMUM</div>
      </div>
      <div style="background:var(--s2);border-radius:8px;padding:10px 8px;text-align:center">
        <div style="font-family:'Bebas Neue';font-size:24px;color:var(--text)">${lastMx}kg</div>
        <div style="font-size:10px;color:var(--muted)">NAPOSLEDY</div>
      </div>
      <div style="background:var(--abg);border-radius:8px;padding:10px 8px;text-align:center;border:1px solid #2d3d00">
        <div style="font-family:'Bebas Neue';font-size:24px;color:var(--accent)">${suggested}kg</div>
        <div style="font-size:10px;color:var(--muted)">PŘÍŠTĚ ZKUS</div>
      </div>
    </div>
    <div style="font-size:11px;color:var(--muted);margin-bottom:6px;letter-spacing:.5px">CVIKY</div>
    ${Object.entries(byEx).map(([ex,d])=>`
      <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--b1)">
        <span style="font-size:13px">${ex}</span>
        <div style="text-align:right">
          <span style="font-size:13px;color:${colors[grp]};font-weight:500">${d.mx}kg</span>
          <span style="font-size:11px;color:var(--muted);margin-left:6px">${d.count}× sérií</span>
        </div>
      </div>`).join('')}
  `;
  detail.style.display='block';
}

// AI CHAT
let aiHistory=[];

async function sendAI(quickMsg){
  const input=document.getElementById('ai-input');
  const send=document.getElementById('ai-send');
  const res=document.getElementById('ai-result');
  const msg=quickMsg||input.value.trim();
  if(!msg)return;
  input.value='';
  send.disabled=true;send.textContent='...';
  res.style.display='block';res.textContent='Přemýšlím...';
  try{
    const{data:mem}=await sb.from('ai_memory').select('key,value');
    const m={};(mem||[]).forEach(r=>m[r.key]=r.value);
    const gld=m.grp_last_dates?JSON.parse(m.grp_last_dates):{};
    const gc=m.grp_counts?JSON.parse(m.grp_counts):{};
    const emw=m.ex_max_weights?JSON.parse(m.ex_max_weights):{};
    const ae=m.all_exercises?JSON.parse(m.all_exercises):[];
    const streak=parseInt(m.current_streak||'0');
    const today=new Date().toLocaleDateString('cs-CZ');
    const tomorrow=new Date();tomorrow.setDate(tomorrow.getDate()+1);
    const grpS=Object.entries(gld).map(([g,d])=>g+': naposledy '+d+', celkem '+(gc[g]||0)+'x').join('\n');
    const exS=ae.map(e=>e+': max '+(emw[e]||0)+'kg').join('\n');
    const systemMsg='Jsi osobní fitness trenér. Artróza kyčle 3. stupně vlevo, ischias. Zakázané: mrtvý tah, dřep s velkou vahou, výpady. Doporučuj VÝHRADNĚ z uvedených cviků. Česky, max 6 vět. Dnes: '+today+', zítra: '+tomorrow.toLocaleDateString('cs-CZ')+', streak: '+streak+' dní.\n\nPARTIE:\n'+grpS+'\n\nCVIKY:\n'+exS;
    aiHistory.push({role:'user',content:msg});
    if(aiHistory.length>10)aiHistory=aiHistory.slice(-10);
    const r=await fetch('https://api.groq.com/openai/v1/chat/completions',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer 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'},
      body:JSON.stringify({model:'groq/compound',messages:[{role:'system',content:systemMsg},...aiHistory],max_tokens:400,temperature:0.5})
    });
    if(!r.ok)throw new Error(await r.text());
    const data=await r.json();
    const reply=data.choices?.[0]?.message?.content||'Nepodařilo se načíst.';
    aiHistory.push({role:'assistant',content:reply});
    res.textContent=reply;
  }catch(e){
    res.textContent='Chyba: '+e.message;
    aiHistory.pop();
  }
  send.disabled=false;send.textContent='→';
}

// AI MEMORY
async function updateAIMemory(){
  const gc={},gld={},emw={};
  sessions.forEach(s=>{
    gc[s.grp]=(gc[s.grp]||0)+1;
    if(!gld[s.grp]||s.date>gld[s.grp])gld[s.grp]=s.date;
    if(!emw[s.ex]||s.weight>emw[s.ex])emw[s.ex]=s.weight||0;
  });
  const td=[...new Set(sessions.map(s=>s.date))].sort();
  let streak=0;const tod=new Date();
  for(let i=0;i<7;i++){const d=new Date(tod);d.setDate(tod.getDate()-i);if(td.includes(d.toLocaleDateString('cs-CZ')))streak++;else break;}
  const u=async(k,v)=>{try{await sb.from('ai_memory').upsert({key:k,value:v,updated_at:new Date().toISOString()},{onConflict:'key'});}catch(e){}};
  await u('grp_last_dates',JSON.stringify(gld));
  await u('grp_counts',JSON.stringify(gc));
  await u('ex_max_weights',JSON.stringify(emw));
  await u('current_streak',String(streak));
  await u('all_exercises',JSON.stringify([...new Set(sessions.map(s=>s.ex))]));
  await u('all_groups',JSON.stringify([...new Set(sessions.map(s=>s.grp))]));
  await u('total_training_days',String(td.length));
}

// SHEETS
function openSheet(id){
  document.getElementById('overlay').classList.add('open');
  setTimeout(()=>document.getElementById(id).classList.add('open'),10);
}
function closeSheet(id){
  document.getElementById(id).classList.remove('open');
}
function closeAll(){
  document.querySelectorAll('.sheet').forEach(s=>s.classList.remove('open'));
  document.getElementById('overlay').classList.remove('open');
  editingIds=[];
}

// TOAST
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}
