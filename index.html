<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Kovárna</title>
<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kovárna">
<meta name="theme-color" content="#0a0a0a">
<link rel="apple-touch-icon" href="/icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0a;--s1:#111;--s2:#1a1a1a;--b1:#1f1f1f;--b2:#2a2a2a;
  --accent:#c8f542;--abg:#1a2200;--text:#e0e0e0;--muted:#555;--m2:#3a3a3a;
  --red:#ff4444;--blue:#4ab8f5;--orange:#f5a142;--pink:#f542c8;
}
html{height:100%;height:100dvh}
body{
  background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:15px;
  display:flex;flex-direction:column;
  height:100%;height:100dvh;
  overflow:hidden;
  padding-top:env(safe-area-inset-top);
  padding-bottom:env(safe-area-inset-bottom);
}

/* ── HEADER ── */
.hdr{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 8px;flex-shrink:0;border-bottom:1px solid var(--b1)}
.logo{font-family:'Bebas Neue';font-size:24px;letter-spacing:2px;color:var(--accent)}
.hdr-date{font-size:11px;color:var(--muted)}
.hdr-btns{display:flex;gap:8px}
.hdr-btn{background:none;border:1px solid var(--b2);color:var(--muted);border-radius:6px;padding:5px 10px;font-size:12px;cursor:pointer}
.hdr-btn.active{border-color:var(--accent);color:var(--accent)}

/* ── MAIN CALENDAR AREA ── */
.cal-area{flex:1;overflow:hidden;position:relative;padding:12px 16px;min-height:0}

/* ── MONTH VIEW ── */
.month-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.month-day-header{text-align:center;font-size:10px;color:var(--muted);padding:4px 0}
.m-day{
  aspect-ratio:1;border-radius:8px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;cursor:pointer;
  border:1px solid transparent;transition:transform .15s,border-color .15s;
  position:relative;overflow:hidden;
}
.m-day:hover{transform:scale(1.15);z-index:10;border-color:var(--b2)}
.m-day.today{border-color:var(--accent)}
.m-day.has-train{background:var(--abg)}
.m-day.is-rest{background:var(--s2)}
.m-day.empty{cursor:default;opacity:0}
.m-day-num{font-size:11px;color:var(--text);line-height:1}
.m-day.today .m-day-num{color:var(--accent);font-weight:500}
.m-dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;margin-top:2px}
.m-dot{width:4px;height:4px;border-radius:50%}
.month-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.month-nav-btn{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;padding:4px 8px}
.month-title{font-family:'Bebas Neue';font-size:18px;letter-spacing:1px;color:var(--text)}

/* ── WEEK VIEW ── */
.week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;flex:1;min-height:0}
.w-day{
  background:var(--s1);border:1px solid var(--b1);border-radius:12px;
  display:flex;flex-direction:column;align-items:center;padding:10px 4px;
  cursor:pointer;transition:transform .15s,border-color .15s,background .15s;
  overflow:hidden;
}
.w-day:hover{transform:scale(1.05);border-color:var(--b2);z-index:5}
.w-day.today{border-color:var(--accent);background:var(--abg)}
.w-day.has-train{background:var(--abg)}
.w-day.is-rest{background:var(--s2)}
.w-day-name{font-size:10px;color:var(--muted);margin-bottom:4px}
.w-day-num{font-family:'Bebas Neue';font-size:22px;color:var(--text);line-height:1}
.w-day.today .w-day-num{color:var(--accent)}
.w-day.has-train .w-day-num{color:var(--accent)}
.w-dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.w-dot{width:6px;height:6px;border-radius:50%}
.w-rest-icon{font-size:16px;margin-top:6px}
.w-action-bar{display:flex;gap:8px;margin-top:12px;flex-shrink:0}
.w-action-btn{flex:1;background:var(--s1);border:1px solid var(--b2);color:var(--muted);border-radius:8px;padding:10px 4px;font-size:12px;cursor:pointer;text-align:center;transition:all .15s}
.w-action-btn:hover{border-color:var(--accent);color:var(--accent)}
.week-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.week-nav-btn{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;padding:4px 8px}
.week-title{font-family:'Bebas Neue';font-size:16px;letter-spacing:1px;color:var(--text)}

/* ── DAY VIEW ── */
.day-view{padding-bottom:20px}
.day-header{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.day-back{background:none;border:1px solid var(--b2);color:var(--muted);border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer}
.day-title{font-family:'Bebas Neue';font-size:24px;letter-spacing:1px;color:var(--text)}
.day-title span{color:var(--accent)}

/* ── SHARED ── */
.btn{background:var(--accent);color:#0a0a0a;border:none;border-radius:8px;font-family:'Bebas Neue';font-size:18px;letter-spacing:1px;padding:12px 20px;cursor:pointer;width:100%}
.btn:active{opacity:.8}
.btn-g{background:none;border:1px solid var(--b2);color:var(--muted);border-radius:8px;font-size:13px;padding:8px 14px;cursor:pointer;transition:all .15s}
.btn-g:hover{border-color:var(--accent);color:var(--accent)}
.inp{background:var(--s2);border:1px solid var(--b2);color:var(--text);border-radius:8px;padding:11px 14px;font-family:'DM Sans';font-size:15px;width:100%;outline:none}
.inp:focus{border-color:var(--accent)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{padding:6px 14px;border-radius:20px;background:var(--s2);border:1px solid var(--b2);color:var(--muted);font-size:13px;cursor:pointer;white-space:nowrap}
.chip.active{background:var(--abg);border-color:var(--accent);color:var(--accent)}
.tag{display:inline-block;font-size:10px;padding:2px 8px;border-radius:4px;background:var(--abg);color:var(--accent)}
.sr{display:grid;grid-template-columns:40px 1fr 1fr 32px;gap:8px;margin-bottom:8px;align-items:center}
.sn{font-family:'Bebas Neue';font-size:22px;color:var(--m2);text-align:center}
.db{background:none;border:none;color:var(--m2);cursor:pointer;font-size:18px;padding:4px}
.db:hover{color:var(--red)}
.pb{background:var(--abg);border:1px solid #2d3d00;border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:12px;color:#aad060}
.pb strong{color:var(--accent)}
.slbl{font-size:11px;color:var(--muted);letter-spacing:.5px;margin-bottom:8px}
.card{background:var(--s1);border:1px solid var(--b1);border-radius:12px;margin-bottom:12px;overflow:hidden}
.cb{padding:14px 16px}
.swipe-item{position:relative;overflow:hidden;border-bottom:1px solid var(--b1)}
.swipe-content{transition:transform .2s ease;background:var(--s1)}
.swipe-actions{position:absolute;right:0;top:0;bottom:0;display:flex;align-items:stretch}
.swipe-btn{border:none;padding:0 18px;font-size:12px;cursor:pointer;font-weight:500;display:flex;align-items:center;justify-content:center;gap:4px}
.swipe-btn.edit{background:#1a2200;color:var(--accent)}
.swipe-btn.del{background:#2a0000;color:var(--red)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--accent);color:#0a0a0a;padding:10px 20px;border-radius:20px;font-size:14px;font-weight:500;z-index:999;pointer-events:none;opacity:0;transition:opacity .2s}
.toast.show{opacity:1}
select.inp{appearance:none;cursor:pointer}
.empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:14px}

/* ── BOTTOM SHEET ── */
.sheet-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200}
.sheet-overlay.open{display:block}
.sheet{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-radius:20px 20px 0 0;padding:20px 16px 40px;max-height:90vh;overflow-y:auto;z-index:201;transform:translateY(100%);transition:transform .3s ease}
.sheet.open{transform:translateY(0)}
.sheet-handle{width:40px;height:4px;background:var(--b2);border-radius:2px;margin:0 auto 20px}
.sheet-title{font-family:'Bebas Neue';font-size:22px;letter-spacing:1px;margin-bottom:16px}

/* ── AI ── */
.ai-result{display:none;margin-top:10px;background:var(--abg);border:1px solid #2d3d00;border-radius:10px;padding:14px;font-size:13px;color:#cce870;line-height:1.7}

/* ── HIST/PROG VIEWS ── */
.sub-view{height:100%;overflow-y:auto;padding-bottom:20px}
.hi{padding:14px 0;border-bottom:1px solid var(--b1);cursor:pointer}
.hi:last-child{border-bottom:none}
.pb-bar{display:flex;gap:4px;align-items:flex-end;height:40px}
.pb-b{flex:1;background:var(--accent);border-radius:3px 3px 0 0;min-height:4px;opacity:.6}
.pb-b:last-child{opacity:1}
</style>
</head>
<body>

<!-- HEADER -->
<div class="hdr">
  <div class="logo">KOVÁRNA</div>
  <div style="display:flex;align-items:center;gap:10px">
    <span class="hdr-date" id="hdr-date"></span>
    <div class="hdr-btns">
      <button class="hdr-btn active" id="btn-cal" onclick="switchMainView('cal')">📅</button>
      <button class="hdr-btn" id="btn-hist" onclick="switchMainView('hist')">📋</button>
      <button class="hdr-btn" id="btn-prog" onclick="switchMainView('prog')">📈</button>
    </div>
  </div>
</div>

<!-- MAIN AREA -->
<div class="cal-area" id="main-area">

  <!-- CALENDAR VIEW -->
  <div id="view-cal" style="height:100%;display:flex;flex-direction:column;min-height:0">

    <!-- MONTH VIEW -->
    <div id="view-month" style="flex:1;display:flex;flex-direction:column;min-height:0">
      <div class="month-nav">
        <button class="month-nav-btn" onclick="monthPrev()">←</button>
        <span class="month-title" id="month-title"></span>
        <button class="month-nav-btn" onclick="monthNext()">→</button>
      </div>
      <div class="month-grid" style="margin-bottom:4px">
        <div class="month-day-header">Po</div><div class="month-day-header">Út</div>
        <div class="month-day-header">St</div><div class="month-day-header">Čt</div>
        <div class="month-day-header">Pá</div><div class="month-day-header">So</div>
        <div class="month-day-header">Ne</div>
      </div>
      <div class="month-grid" id="month-grid" style="flex:1;align-content:start"></div>
    </div>

    <!-- WEEK VIEW -->
    <div id="view-week" style="flex:1;display:none;flex-direction:column;min-height:0">
      <div class="week-nav">
        <button class="week-nav-btn" onclick="weekPrev()">←</button>
        <button class="week-nav-btn" onclick="goToMonth()" style="font-size:13px;font-family:DM Sans;letter-spacing:0">📅 Měsíc</button>
        <span class="week-title" id="week-title"></span>
        <button class="week-nav-btn" onclick="weekNext()">→</button>
      </div>
      <div class="week-grid" id="week-grid" style="flex:1"></div>
      <div class="w-action-bar" id="week-actions"></div>
    </div>

    <!-- DAY VIEW -->
    <div id="view-day" style="flex:1;display:none;overflow-y:auto">
      <div class="day-view">
        <div class="day-header">
          <button class="day-back" onclick="goToWeek()">← Týden</button>
          <div class="day-title" id="day-title"></div>
        </div>

        <!-- AI -->
        <div style="margin-bottom:16px">
          <button class="btn-g" id="ai-btn" onclick="getAIAdvice()" style="width:100%;padding:10px;border-color:var(--accent);color:var(--accent)">🤖 Co dnes cvičit?</button>
          <div class="ai-result" id="ai-result"></div>
        </div>

        <!-- TODAY LOG -->
        <div id="day-log"></div>

        <!-- ADD BUTTON -->
        <button class="btn" onclick="openTrainSheet()" style="margin-bottom:10px">+ ZAPSAT TRÉNINK</button>
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
          <div style="flex:1;height:1px;background:var(--b1)"></div>
          <span style="font-size:10px;color:var(--muted)">NEBO</span>
          <div style="flex:1;height:1px;background:var(--b1)"></div>
        </div>
        <button class="btn-g" onclick="saveRestDayForSelected()" style="width:100%;padding:10px">🛌 Označit jako volno</button>
      </div>
    </div>

  </div>

  <!-- HISTORY VIEW -->
  <div id="view-hist" style="height:100%;display:none">
    <div class="sub-view">
      <div style="display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:12px;scrollbar-width:none" id="hist-filter"></div>
      <div class="card"><div class="cb" id="hist-list" style="padding-top:14px"></div></div>
    </div>
  </div>

  <!-- PROGRESS VIEW -->
  <div id="view-prog" style="height:100%;display:none">
    <div class="sub-view">
      <div class="slbl">MAXIMA PO CVIKU</div>
      <div class="card"><div class="cb" id="prog-list" style="padding-top:14px"></div></div>
    </div>
  </div>

</div>

<!-- SHEET — ZÁPIS TRÉNINKU -->
<div class="sheet-overlay" id="sheet-overlay" onclick="closeTrainSheet()"></div>
<div class="sheet" id="train-sheet">
  <div class="sheet-handle"></div>
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
    <div class="sheet-title" id="sheet-title">ZAPSAT TRÉNINK</div>
    <button onclick="closeTrainSheet()" style="background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer">×</button>
  </div>

  <div class="slbl">PARTIE</div>
  <div class="chips" id="gchips"></div>
  <div class="slbl">CVIK</div>
  <select class="inp" id="esel" style="margin-bottom:14px" onchange="updPrev()"></select>
  <div style="display:flex;gap:8px;margin-bottom:14px">
    <input class="inp" id="newinp" placeholder="Vlastní cvik..." style="flex:1">
    <button class="btn-g" onclick="addCustom()">+ Přidat</button>
  </div>
  <div id="pbbox" style="display:none" class="pb"></div>
  <div class="slbl">SÉRIE</div>
  <div style="display:grid;grid-template-columns:40px 1fr 1fr 32px;gap:8px;padding:0 2px;margin-bottom:6px">
    <span></span><span style="font-size:10px;color:var(--muted)">Opak.</span><span style="font-size:10px;color:var(--muted)">Váha kg</span><span></span>
  </div>
  <div id="sets"></div>
  <button class="btn-g" onclick="addSet()" style="width:100%;margin-bottom:14px">+ Série</button>
  <input class="inp" id="note" placeholder="Poznámka..." style="margin-bottom:14px">
  <button class="btn" onclick="saveEntry()">ULOŽIT</button>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL='https://deikqifciyrwyixrnlcm.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRlaWtxaWZjaXlyd3lpeHJubGNtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkwNDkyNzUsImV4cCI6MjEwNDYyNTI3NX0.GLVzb164MexRX2QoObwFErZu8Bky-HuAWTAuw7-Cm08';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const GROUPS=['Záda','Hrudník','Nohy','Ramena','Biceps','Triceps','Břicho'];
const DEF={
  Záda:['Přítahy na hrazdě','Veslování s činkou','Jednorůční veslování','Lat pulldown','Seated row','Hyperextenze'],
  Hrudník:['Bench press','Šikmý bench press','Peck deck','Dips na bradlech'],
  Nohy:['Leg press','Leg curl','Leg extension','Hip thrust','Lýtka'],
  Ramena:['Vojenský tlak','Laterální zdvihy','Face pull'],
  Biceps:['Bicepsový zdvih s tyčí','Kladivové zdvihy','Kabelový zdvih'],
  Triceps:['Dips na bradlech','Tricepsový tlak s kladkou','Francouzský tlak'],
  Břicho:['Hanging knee raise','Plank','Cable crunch']
};
const GRP_COLORS={Záda:'#c8f542',Hrudník:'#42b8f5',Nohy:'#f5a142',Ramena:'#f542c8',Biceps:'#42f5a1',Triceps:'#f5f542',Břicho:'#f54242'};
const MONTHS=['Leden','Únor','Březen','Duben','Květen','Červen','Červenec','Srpen','Září','Říjen','Listopad','Prosinec'];
const DAYS=['Ne','Po','Út','St','Čt','Pá','So'];

// ── STATE ─────────────────────────────────────────────
let sessions=[],custom={},restDays=[];
let grp='Záda',sets=[{r:'',w:''}],expH=null,hf='Vše';
let calView='month'; // month | week | day
let calMonth=new Date().getMonth(),calYear=new Date().getFullYear();
let calWeekStart=mondayOf(new Date());
let calSelectedDate=new Date().toLocaleDateString('cs-CZ');
let mainView='cal'; // cal | hist | prog

// ── INIT ──────────────────────────────────────────────
async function init(){
  document.getElementById('hdr-date').textContent=new Date().toLocaleDateString('cs-CZ');
  renderG();renderE();renderS();
  await Promise.all([loadSessions(),loadRestDays()]);
  renderCalendar();
  renderHist();
  renderProg();
}

async function loadSessions(){
  try{
    const{data,error}=await sb.from('gym_sessions').select('*').order('created_at',{ascending:false}).limit(500);
    if(error)throw error;
    sessions=data||[];
  }catch(e){console.log('Load error',e);}
}

async function loadRestDays(){
  try{
    const{data}=await sb.from('rest_days').select('*');
    restDays=(data||[]).map(r=>r.date);
  }catch(e){console.log('Rest days error',e);}
}

// ── HELPERS ───────────────────────────────────────────
function mondayOf(date){
  const d=new Date(date);
  const dow=d.getDay()===0?6:d.getDay()-1;
  d.setDate(d.getDate()-dow);
  d.setHours(0,0,0,0);
  return d;
}

function dateStr(d){return new Date(d).toLocaleDateString('cs-CZ');}

function trainDates(){return new Set(sessions.map(s=>s.date));}
function restSet(){return new Set(restDays);}

function grpsForDate(date){
  return [...new Set(sessions.filter(s=>s.date===date).map(s=>s.grp))];
}

// ── MAIN VIEW SWITCH ──────────────────────────────────
function switchMainView(v){
  mainView=v;
  ['cal','hist','prog'].forEach(name=>{
    document.getElementById('view-'+name).style.display=name===v?'':'none';
    document.getElementById('btn-'+name).classList.toggle('active',name===v);
  });
}

// ── CALENDAR NAVIGATION ───────────────────────────────
function renderCalendar(){
  if(calView==='month')renderMonth();
  else if(calView==='week')renderWeek();
  else renderDay();
}

function goToMonth(){
  calView='month';
  document.getElementById('view-month').style.display='';
  document.getElementById('view-week').style.display='none';
  document.getElementById('view-day').style.display='none';
}

function goToWeek(){
  calView='week';
  document.getElementById('view-month').style.display='none';
  document.getElementById('view-week').style.display='flex';
  document.getElementById('view-week').style.flexDirection='column';
  document.getElementById('view-day').style.display='none';
  renderWeek();
}

function goToDay(date){
  calSelectedDate=date;
  calView='day';
  // Set week to contain this day
  const d=new Date(date.split('.').reverse().join('-'));
  calWeekStart=mondayOf(d);
  document.getElementById('view-month').style.display='none';
  document.getElementById('view-week').style.display='none';
  document.getElementById('view-day').style.display='block';
  renderDay();
}

// ── MONTH VIEW ────────────────────────────────────────
function renderMonth(){
  const title=MONTHS[calMonth]+' '+calYear;
  document.getElementById('month-title').textContent=title;
  const firstDay=new Date(calYear,calMonth,1);
  const totalDays=new Date(calYear,calMonth+1,0).getDate();
  const startDow=firstDay.getDay()===0?6:firstDay.getDay()-1;
  const dates=trainDates();
  const rests=restSet();
  const todayStr=new Date().toLocaleDateString('cs-CZ');
  let html='';
  for(let i=0;i<startDow;i++)html+='<div class="m-day empty"></div>';
  for(let d=1;d<=totalDays;d++){
    const dt=new Date(calYear,calMonth,d).toLocaleDateString('cs-CZ');
    const hasTrain=dates.has(dt);
    const isRest=rests.has(dt);
    const isToday=dt===todayStr;
    const grps=grpsForDate(dt);
    const dots=grps.slice(0,3).map(g=>'<div class="m-dot" style="background:'+GRP_COLORS[g]+'"></div>').join('');
    html+='<div class="m-day'+(hasTrain?' has-train':'')+(isRest?' is-rest':'')+(isToday?' today':'')+'" onclick="goToDay(\''+dt+'\')">'
      +'<div class="m-day-num">'+d+'</div>'
      +'<div class="m-dots">'+(hasTrain?dots:isRest?'🛌':'')+'</div>'
      +'</div>';
  }
  document.getElementById('month-grid').innerHTML=html;
}

// ── SWIPE TO EDIT/DELETE ──────────────────────────────
function initSwipe(){
  document.querySelectorAll('.swipe-item').forEach(item=>{
    const content=item.querySelector('.swipe-content');
    const actions=item.querySelector('.swipe-actions');
    let startX=0,startY=0,currentX=0,swiped=false;
    const ACTION_W=130;

    content.addEventListener('touchstart',e=>{
      startX=e.touches[0].clientX;
      startY=e.touches[0].clientY;
      currentX=0;
      content.style.transition='none';
    },{passive:true});

    content.addEventListener('touchmove',e=>{
      const dx=e.touches[0].clientX-startX;
      const dy=e.touches[0].clientY-startY;
      if(Math.abs(dy)>Math.abs(dx)&&!swiped)return;
      currentX=Math.max(-ACTION_W,Math.min(0,dx));
      content.style.transform='translateX('+currentX+'px)';
      actions.style.width=Math.abs(currentX)+'px';
    },{passive:true});

    content.addEventListener('touchend',()=>{
      content.style.transition='transform .2s ease';
      if(currentX<-ACTION_W/2){
        content.style.transform='translateX(-'+ACTION_W+'px)';
        actions.style.width=ACTION_W+'px';
        swiped=true;
      } else {
        content.style.transform='translateX(0)';
        actions.style.width='0';
        swiped=false;
      }
    });

    // Tap elsewhere to close
    content.addEventListener('click',()=>{
      if(swiped){
        content.style.transition='transform .2s ease';
        content.style.transform='translateX(0)';
        actions.style.width='0';
        swiped=false;
      }
    });
  });
}

// ── SAVE ENTRY ────────────────────────────────────────
async function saveEntry(){
  const ex=document.getElementById('esel').value;
  const vs=sets.filter(s=>s.r||s.w);
  if(!ex||!vs.length){showToast('Vyplň cvik a sérii');return;}
  const note=document.getElementById('note').value.trim();
  const sheet=document.getElementById('train-sheet');
  const isEdit=sheet.dataset.editMode==='true';
  try{
    if(isEdit&&editingIds.length){
      await sb.from('gym_sessions').delete().in('id',editingIds);
      sessions=sessions.filter(s=>!editingIds.includes(String(s.id)));
    }
    const rows=vs.map((s,i)=>({date:calSelectedDate,grp,ex,serie:i+1,reps:s.r||0,weight:s.w||0,note:i===0?note:''}));
    const{data,error}=await sb.from('gym_sessions').insert(rows).select();
    if(error)throw error;
    sessions.unshift(...(data||rows.map((r,i)=>({...r,id:Date.now()+i}))));
    sets=[{r:'',w:''}];
    document.getElementById('note').value='';
    renderS();closeTrainSheet();
    renderDay();renderHist();renderProg();
    if(calView==='month')renderMonth();
    if(calView==='week')renderWeek();
    showToast(isEdit?'✓ Upraveno':'✓ Uloženo');
    updateAIMemory();
  }catch(e){showToast('Chyba: '+e.message);}
}

// ── PROGRESS ──────────────────────────────────────────
function renderProg(){
  const map={};
  sessions.forEach(s=>{
    const k=s.grp+'|'+s.ex;
    if(!map[k])map[k]=[];
    map[k].push({date:s.date,mx:s.weight||0,ts:new Date(s.created_at||0).getTime()});
  });
  const keys=Object.keys(map);
  const l=document.getElementById('prog-list');
  if(!keys.length){l.innerHTML='<div class="empty">Zatím žádná data</div>';return;}

  const grouped={};
  sessions.forEach(s=>{
    const k=s.grp+'|'+s.ex+'|'+s.date;
    if(!grouped[k])grouped[k]={k:s.grp+'|'+s.ex,date:s.date,mx:0,ts:new Date(s.created_at||0).getTime()};
    if((s.weight||0)>grouped[k].mx)grouped[k].mx=s.weight||0;
  });

  l.innerHTML=keys.map(k=>{
    const[g,ex]=k.split('|');
    const data=Object.values(grouped).filter(d=>d.k===k).sort((a,b)=>a.ts-b.ts);
    if(!data.length)return'';
    const mxe=Math.max(...data.map(d=>d.mx));
    const last=data[data.length-1];
    const first=data[0];
    const imp=last.mx-first.mx;
    const bm=mxe||1;
    const bars=data.slice(-8).map(d=>{
      const h=Math.max(4,Math.round((d.mx/bm)*40));
      return '<div class="pb-b" style="height:'+h+'px" title="'+d.date+': '+d.mx+'kg"></div>';
    }).join('');
    return '<div style="padding:14px 0;border-bottom:1px solid var(--b1)">'
      +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">'
      +'<div><span class="tag">'+g+'</span><span style="font-size:14px;font-weight:500;margin-left:8px">'+ex+'</span></div>'
      +(imp>0?'<span style="font-size:11px;color:var(--accent)">+'+imp+'kg ↑</span>':'')
      +'</div>'
      +'<div class="pb-bar">'+bars+'</div>'
      +'<div style="display:flex;gap:16px;margin-top:6px;font-size:12px;color:var(--muted)">'
      +'<span>Max: <strong style="color:var(--accent)">'+mxe+'kg</strong></span>'
      +'<span>Poslední: <strong style="color:var(--accent)">'+last.mx+'kg</strong></span>'
      +'<span>'+data.length+'× trénink</span></div>'
      +'</div>';
  }).join('');
}

// ── AI MEMORY ─────────────────────────────────────────
async function updateAIMemory(){
  const grpCounts={};const grpLastDate={};const exWeights={};
  sessions.forEach(s=>{
    grpCounts[s.grp]=(grpCounts[s.grp]||0)+1;
    if(!grpLastDate[s.grp]||s.date>grpLastDate[s.grp])grpLastDate[s.grp]=s.date;
    if(!exWeights[s.ex]||s.weight>exWeights[s.ex])exWeights[s.ex]=s.weight||0;
  });
  const trainDays=[...new Set(sessions.map(s=>s.date))].sort();
  let streak=0;const tod=new Date();
  for(let i=0;i<7;i++){
    const d=new Date(tod);d.setDate(tod.getDate()-i);
    if(trainDays.includes(d.toLocaleDateString('cs-CZ')))streak++;else break;
  }
  const upsert=async(key,value)=>{
    try{await sb.from('ai_memory').upsert({key,value,updated_at:new Date().toISOString()},{onConflict:'key'});}catch(e){}
  };
  await upsert('grp_last_dates',JSON.stringify(grpLastDate));
  await upsert('grp_counts',JSON.stringify(grpCounts));
  await upsert('ex_max_weights',JSON.stringify(exWeights));
  await upsert('total_training_days',String(trainDays.length));
  await upsert('current_streak',String(streak));
  await upsert('all_exercises',JSON.stringify([...new Set(sessions.map(s=>s.ex))]));
  await upsert('all_groups',JSON.stringify([...new Set(sessions.map(s=>s.grp))]));
}

        max_tokens:400,temperature:0.4
      })
    });
    if(!res.ok)throw new Error(await res.text());
    const data=await res.json();
    const text=data.choices?.[0]?.message?.content;
    result.style.display='block';result.textContent=text||'Nepodařilo se načíst.';
  }catch(e){
    result.style.display='block';result.textContent='Chyba: '+e.message;
  }
  btn.textContent='🤖 Co dnes cvičit?';btn.disabled=false;
}

// ── TOAST ─────────────────────────────────────────────
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

// ── SERVICE WORKER ────────────────────────────────────
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('/sw.js').catch(()=>{});
  });
}

init();
</script>
